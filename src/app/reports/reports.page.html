<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Reportes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Calificación por Stand</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <canvas #ratingsChart></canvas>
          </ion-card-content>
        </ion-card>
      </ion-col>
      
      <ion-col size="12" size-md="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Picos de Visitantes</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <canvas #peaksChart></canvas>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-card *ngIf="visitsPerStand.length > 0">
    <ion-list-header>
      <ion-label>Visitas por Stand</ion-label>
    </ion-list-header>
    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let item of visitsPerStand">
          <ion-icon name="podium-outline" slot="start" color="primary"></ion-icon>
          <ion-label>{{ item.standName }}</ion-label>
          <ion-badge color="tertiary" slot="end">{{ item.count }}</ion-badge>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="visitsPerStand.length === 0">
    <ion-card-content class="ion-text-center">
      <p>Aún no hay visitas registradas.</p>
    </ion-card-content>
  </ion-card>

</ion-content>
