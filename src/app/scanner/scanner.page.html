<ion-header [translucent]="true">
  <ion-toolbar class="glass-header">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Escanear Visita</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card *ngIf="myStand" class="gourmet-ticket animate-fade-up delay-100">
    <ion-card-header>
      <ion-card-title>Stand: {{ myStand.nombre }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Escanea el código QR del participante para registrar la visita a tu stand.</p>
      
      <ion-button expand="block" (click)="startScanner()" *ngIf="!isScanning">
        <ion-icon name="qr-code-outline" slot="start"></ion-icon>
        Iniciar Escáner
      </ion-button>

      <div id="qr-reader" *ngIf="isScanning" style="width:100%; margin-top: 20px;"></div>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="!myStand" class="animate-fade-up delay-100">
    <ion-card-content class="ion-text-center">
      <ion-icon name="warning-outline" color="warning" style="font-size: 48px;"></ion-icon>
      <h2>No hay stand asignado</h2>
      <p>Comunícate con el administrador para que asigne un stand a tu cuenta.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
