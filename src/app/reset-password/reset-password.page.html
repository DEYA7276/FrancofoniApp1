<ion-content [fullscreen]="true">

  <!-- Golden floating particles -->
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-wrapper">
    <div class="logo-header">
      <img src="assets/logo_participante.png" class="main-logo" alt="Logo Francofonía">
      <h1 style="font-size: 1.6rem;">Nueva Contraseña</h1>
      <p>"La seguridad de tu cuenta es primero"</p>
    </div>

    <div class="glass-card">
      <div class="login-form">

        <p class="instruction-text anim-fade-up delay-1">
          Crea una nueva contraseña para tu cuenta (mín. 8 caracteres).
        </p>

        <form [formGroup]="resetForm" (ngSubmit)="onResetPassword()">
          
          <ion-item class="anim-fade-up delay-2">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input type="password" placeholder="Nueva Contraseña" formControlName="password"></ion-input>
          </ion-item>
          <div *ngIf="resetForm.get('password')?.invalid && resetForm.get('password')?.touched" class="error-box anim-fade-up delay-2" style="margin-top:0;">
            Mínimo 8 caracteres requeridos.
          </div>

          <ion-item class="anim-fade-up delay-3" style="margin-top:15px;">
            <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
            <ion-input type="password" placeholder="Confirmar Contraseña" formControlName="confirmPassword"></ion-input>
          </ion-item>
          <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched" class="error-box anim-fade-up delay-3" style="margin-top:0;">
            Las contraseñas no coinciden.
          </div>

          <!-- Diálogos se manejan vía AlertController -->

        </form>

      </div>
    </div>
  </div>
</ion-content>
