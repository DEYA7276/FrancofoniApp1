<ion-content [fullscreen]="true">

  <!-- Golden floating particles -->
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-wrapper">
    <div class="logo-header">
      <img src="assets/logo_participante.png" class="main-logo" alt="Logo Francofonía">
      <h1>Recuperar Acceso</h1>
      <p>"La gastronomía une al mundo"</p>
    </div>

    <div class="glass-card">
      <div class="login-form">
        
        <p class="instruction-text anim-fade-up delay-1">
          Ingresa tu correo para recibir un enlace de restablecimiento.
        </p>

        <form [formGroup]="forgotForm" (ngSubmit)="onRequestReset()">
          
          <ion-item class="anim-fade-up delay-2">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-input type="email" placeholder="Correo electrónico" formControlName="email"></ion-input>
          </ion-item>
          
          <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched" class="error-box anim-fade-up delay-2">
            Por favor, ingresa un correo válido.
          </div>

          <!-- Diálogos se manejan vía AlertController -->

          <ion-button expand="block" type="submit" [disabled]="!forgotForm.valid || isLoading" class="login-btn anim-fade-up delay-3">
            <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
            <span *ngIf="!isLoading">Enviar Enlace</span>
          </ion-button>

          <ion-button expand="block" fill="clear" routerLink="/login" class="back-btn anim-fade-up delay-4">
            Volver al Inicio
          </ion-button>

        </form>

      </div>
    </div>
  </div>
</ion-content>
