<ion-content [fullscreen]="true">

  <!-- Golden floating particles -->
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-wrapper">
    <div class="logo-header">
      <img src="assets/logo_participante.png" class="main-logo" alt="Logo Francofonía">
      <h1>Francofonía 2026</h1>
      <p>"La gastronomía une al mundo"</p>
    </div>

    <div class="glass-card">
      <div class="custom-toggle">
        <div class="slider" [class.staff]="loginMode === 'staff'"></div>
        <div class="toggle-option" (click)="loginMode = 'guest'" [class.active]="loginMode === 'guest'">
          <ion-icon name="ticket-outline"></ion-icon>
          <span>Soy Invitado</span>
        </div>
        <div class="toggle-option" (click)="loginMode = 'staff'" [class.active]="loginMode === 'staff'">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
          <span>Acceso Staff</span>
        </div>
      </div>

      <div class="login-form">
        <div *ngIf="loginMode === 'guest'">
          <p class="guest-info anim-fade-up delay-1">
            Ingresa tu correo de registro para ver tu Mapa 3D NAKU y progreso.
          </p>
          <ion-item class="anim-fade-up delay-2">
            <ion-label position="stacked">Mi Correo</ion-label>
            <ion-input type="email" [(ngModel)]="guestEmail" placeholder="Tu correo electrónico"></ion-input>
          </ion-item>
          <ion-button expand="block" class="login-btn anim-fade-up delay-3" (click)="onGuestLogin()">
            Entrar al Evento
          </ion-button>
        </div>

        <div *ngIf="loginMode === 'staff'">
          <ion-item class="anim-fade-up delay-1">
            <ion-label position="stacked">Correo Staff</ion-label>
            <ion-input type="email" [(ngModel)]="staffEmail" placeholder="staff@correo.com"></ion-input>
          </ion-item>
          <ion-item class="anim-fade-up delay-2">
            <ion-label position="stacked">Contraseña</ion-label>
            <ion-input type="password" [(ngModel)]="password" placeholder="••••••••"></ion-input>
          </ion-item>
          <ion-button expand="block" class="login-btn anim-fade-up delay-3" (click)="onStaffLogin()">
            Acceso Administrativo
          </ion-button>
        </div>
      </div>
    </div>
  </div>

  <ion-toast
    [isOpen]="isToastOpen"
    message="{{ errorMessage }}"
    duration="2000"
    (didDismiss)="setOpen(false)">
  </ion-toast>
</ion-content>
